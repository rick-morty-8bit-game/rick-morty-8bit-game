name: Build Android APKon:  workflow_dispatch:  push:    paths:      - 'app/**'      - 'build.gradle'      - 'settings.gradle'      - 'gradle.properties'      - '.github/workflows/main.yml'jobs:  build:    runs-on: ubuntu-latest    steps:      - name: Checkout repository        uses: actions/checkout@v4      - name: Set up JDK        uses: actions/setup-java@v4        with:          distribution: temurin          java-version: '17'      - name: Build APK        run: |          chmod +x gradlew          ./gradlew assembleDebug      - name: Upload APK        uses: actions/upload-artifact@v4        with:          name: RickMortyAndroid-APK          path: app/build/outputs/apk/debug/*.apk
